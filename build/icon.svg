  <rect x="60" y="65" width="50" height="12" fill="white"/>
  <rect x="60" y="99" width="50" height="12" fill="white"/>
  <rect x="60" y="133" width="50" height="12" fill="white"/>
  <rect x="98" y="65" width="12" height="40" fill="white"/>
  <rect x="98" y="105" width="12" height="40" fill="white"/>
  <!-- Letter C -->
