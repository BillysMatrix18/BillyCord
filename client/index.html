<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BillyCord</title>
  </head>
  <body>
    <script>
      document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');
      document.documentElement.setAttribute('data-animations',localStorage.getItem('animationsEnabled')||'on');
      document.documentElement.style.setProperty('--animation-speed',(localStorage.getItem('animationSpeed')||'300')+'ms');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
